name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install zbar --no-progress -y

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zbar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check src/ tests/

      - name: Run mypy
        run: python -m mypy src/ --ignore-missing-imports
        continue-on-error: ${{ runner.os == 'macOS' }}

      - name: Run tests
        run: python -m pytest tests/ -v
        continue-on-error: ${{ runner.os == 'macOS' }}

  test-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Install Python dependencies (no opencv)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python || true

      - name: Run tests (cv2-free only)
        run: python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qr-reader-mcp-server .

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"

      - name: Run benchmarks
        run: python -m pytest benchmarks/ -v --benchmark-only --benchmark-json=benchmark.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
