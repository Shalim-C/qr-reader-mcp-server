[project]
name = "qr-reader-mcp-server"
version = "0.1.0"
description = "An MCP server that decodes QR codes from images — returns detailed quality metrics and failure reasons so AI agents can self-correct."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "qr-code", "barcode", "opencv", "ai-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.28.0,<2.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
light = [
    "pyzbar>=0.1.9",
]
full = [
    "opencv-python>=4.9.0",
    "pyzbar>=0.1.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "qrcode[pil]>=7.4.0",
    "opencv-python>=4.9.0",
    "pyzbar>=0.1.9",
]
bench = [
    "pytest-benchmark>=5.0.0",
    "opencv-python>=4.9.0",
    "pyzbar>=0.1.9",
    "qrcode[pil]>=7.4.0",
]

[project.scripts]
qr-reader-mcp = "qr_reader.server:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "benchmark: marks a test as a performance benchmark (deselected by default)",
]
addopts = "--strict-markers --ignore=tests/bench"
